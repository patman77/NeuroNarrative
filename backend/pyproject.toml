[project]
name = "neuronarrative-backend"
version = "0.1.0"
description = "FastAPI backend for NeuroNarrative multimodal analysis"
authors = [
    { name = "NeuroNarrative Team", email = "dev@example.com" }
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
    "ruptures>=1.1.9",
    "httpx>=0.27",
    "platformdirs>=4.0",
    "python-dotenv>=1.0"
]

[project.scripts]
neuronarrative = "app.desktop:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "requests>=2.31"]
# Native window for the desktop build. pywebview uses the OS webview (WKWebView on
# macOS), so it adds a window without bundling a browser engine.
desktop = [
    "pywebview>=5.0",
    # macOS and Windows lend pywebview a system webview (WKWebView / WebView2). Linux has no
    # such thing to borrow — pywebview's GTK backend needs PyGObject *and* a webkit2gtk the
    # user may not have installed, and without one it falls back to opening a browser tab. Qt
    # brings its own engine (QtWebEngine lives in PySide6-Addons, pulled in by PySide6), so the
    # bundle is self-contained at the cost of a few hundred MB — the same trade the macOS build
    # does not have to make.
    "PySide6>=6.7; sys_platform == 'linux'",
    "qtpy>=2.4; sys_platform == 'linux'",
]
packaging = ["pyinstaller>=6.6"]
# faster-whisper (CTranslate2) rather than openai-whisper: same tiny model, no torch.
# Keeps the desktop bundle ~500 MB smaller and avoids freezing torch with PyInstaller.
asr = ["faster-whisper>=1.0"]
# Apple silicon only: MLX runs Whisper on the Metal GPU (~4x faster than CPU int8 and
# slightly more accurate, being float16). The marker makes this a no-op elsewhere, so
# `pip install ".[asr,gpu]"` is safe on Windows and Linux.
gpu = ["mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.pytest.ini_options]
pythonpath = ["."]
