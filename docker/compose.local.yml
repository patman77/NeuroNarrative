name: neuronnarrative

services:
  backend:
    platform: linux/arm64
    build:
      context: ${COMPOSE_PROJECT_DIR:-.}
      dockerfile: docker/backend.Dockerfile
    ports:
      - "8000:8000"
    environment:
      NEURONARRATIVE_OLLAMA_URL: ${NEURONARRATIVE_OLLAMA_URL:-http://ollama:11434/api/generate}
      NEURONARRATIVE_REQUIRE_GPU_FOR_SUMMARIZER: ${NEURONARRATIVE_REQUIRE_GPU_FOR_SUMMARIZER:-true}
    volumes:
      # Staged uploads and the downloaded ASR model both live under /data so they
      # survive container restarts (see NEURONARRATIVE_UPLOAD_DIR / _ASR_MODEL_DIR).
      - uploads:/data

  frontend:
    platform: linux/arm64
    build:
      context: ${COMPOSE_PROJECT_DIR:-.}
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "5173:5173"
    environment:
      # The browser talks to the Vite dev server, which proxies /api to the
      # backend container. Do not set VITE_API_BASE_URL here: the client
      # already prefixes /api, so a base URL ending in /api yields /api/api/...
      - VITE_PROXY_TARGET=http://backend:8000
    depends_on:
      - backend

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    profiles:
      - summarizer
    gpus:
      - driver: nvidia
        count: all
        capabilities:
          - compute
          - utility

volumes:
  uploads:
  ollama:
